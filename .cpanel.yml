---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/sites/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp enviar.php $DEPLOYPATH
    - /bin/cp logo-email.png $DEPLOYPATH
    - /bin/cp avatar-email.png $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/lojas/img
    - /bin/cp lojas/index.html $DEPLOYPATH/lojas/
    - /bin/cp lojas/img/*.jpg $DEPLOYPATH/lojas/img/
